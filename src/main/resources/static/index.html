
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Aggroso - Final Aura Theme</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
*{font-family:'Outfit',sans-serif}
.serif{font-family:'Playfair Display',serif}
/* FINAL - Nee pic kosam 2 options - edaina okati work avuthundi */
.bg-aura{
  position:fixed; inset:0; z-index:-1;
  /* Option 1: Spring Boot static folder lo bg.png unte */
  background: url('bg.png'),
  /* Option 2: Online dark interior - bg.png lekunna kuda same theme vastundi */
              url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1200&q=80');
  background-size:cover;
  background-position:left center;
  filter: brightness(0.9);
}
.aura-panel{background: #131A15;}
.aura-input{background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); color:white;}
.aura-input::placeholder{color: rgba(255,255,255,0.35);}
.aura-btn{background: #8DAA8D; color:#111A12;}
.aura-btn:hover{background:#9abc9a;}
</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {useState}=React;
function App(){
  const [role,setRole]=useState(localStorage.getItem('role')||'');
  const [logged,setLogged]=useState(!!role);
  const [view,setView]=useState(role||'user');
  const [form,setForm]=useState({claimant:'Ravi',date:new Date().toISOString().split('T')[0],category:'MEALS',amount:50,description:'Client dinner at Taj',receipt:true});
  const [res,setRes]=useState(null),
  [hist,setHist]=useState([
    {claimId:'CLM-1001',claimant:'Ravi',category:'MEALS',amount:50,status:'COMPLIANT',note:'Within policy limit',date:'2026-10-07'},
    {claimId:'CLM-1002',claimant:'Ravi',category:'TRAVEL',amount:200,status:'NEEDS_REVIEW',note:'Exceeds limit - needs review',date:'2026-10-06'}
  ]),
  [unlock,setUnlock]=useState(false);

  const submit=()=>{
    const r={
      claimId:'CLM-'+Date.now().toString().slice(-4),
      claimant:form.claimant,
      category:form.category,
      amount:+form.amount,
      status:+form.amount<=100?'COMPLIANT':'NEEDS_REVIEW',
      note:+form.amount<=100?'Within policy limit':'Exceeds limit - needs admin review',
      date:form.date
    };
    setRes(r);
    setHist(p=>[r,...p]);
  };

  if(!logged) return (
    <div className="min-h-screen flex relative overflow-hidden">
      <div className="bg-aura"></div>
      <div className="hidden md:block w-[55%] relative"></div>
      <div className="w-full md:w-[45%] aura-panel min-h-screen flex items-center justify-center p-8 md:p-12">
        <div className="w-full max-w-[380px]">
          <div className="text-center mb-8">
            <h1 className="text-2xl font-semibold text-white">Aggroso Spaces</h1>
            <p className="text-[#8DAA8D] text-sm mt-1">Welcome Back</p>
            <h2 className="serif text-[32px] font-semibold text-white mt-6 leading-tight">Sign In To Continue</h2>
            <p className="text-white/50 text-[13px] mt-3 leading-relaxed">Enter your credentials to access your account<br/>and manage your expenses.</p>
          </div>
          <div className="space-y-5">
            <div>
              <label className="text-white/70 text-[13px]">Email Address / Login ID</label>
              <div className="mt-2 relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-white/30">✉️</span>
                <input id="loginId" defaultValue="food_system" className="aura-input w-full pl-11 pr-4 py-3.5 rounded-xl text-sm outline-none focus:border-[#8DAA8D]/50" placeholder="example@email.com"/>
              </div>
            </div>
            <div>
              <label className="text-white/70 text-[13px]">Password</label>
              <div className="mt-2 relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-white/30">🔒</span>
                <input id="loginPass" type="password" defaultValue="12345" className="aura-input w-full pl-11 pr-12 py-3.5 rounded-xl text-sm outline-none" placeholder="Enter your password"/>
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-white/30">👁️</span>
              </div>
            </div>
            <div className="flex justify-between items-center py-1">
              <label className="flex items-center gap-2 text-[13px] text-white/60"><input type="checkbox" defaultChecked className="w-4 h-4 rounded accent-[#8DAA8D]"/> Remember Me</label>
              <button className="text-[13px] text-[#8DAA8D]">Forgot Password?</button>
            </div>
            <button onClick={()=>{localStorage.setItem('role','user'); setRole('user'); setView('user'); setLogged(true);}} className="aura-btn w-full py-3.5 rounded-full font-semibold text-[15px] flex items-center justify-center gap-3 relative">Sign In<span className="absolute right-1.5 w-9 h-9 bg-[#131A15] rounded-full flex items-center justify-center text-white">↗</span></button>
            <div className="flex items-center gap-4 py-2"><div className="flex-1 h-[1px] bg-white/10"></div><span className="text-white/40 text-xs">or continue with</span><div className="flex-1 h-[1px] bg-white/10"></div></div>
            <div className="grid grid-cols-2 gap-3">
              <button onClick={()=>{localStorage.setItem('role','user'); setRole('user'); setView('user'); setLogged(true);}} className="aura-input py-3 rounded-full flex items-center justify-center gap-2 text-sm hover:bg-white/[0.08]">G Google</button>
              <button onClick={()=>{localStorage.setItem('role','admin'); setRole('admin'); setView('admin'); setLogged(true);}} className="aura-input py-3 rounded-full flex items-center justify-center gap-2 text-sm hover:bg-white/[0.08]"> Apple - Admin</button>
            </div>
            <div className="text-center pt-2">
              <p className="text-white/50 text-[13px]">Demo: <span className="text-white">user / user123</span> • <span className="text-[#8DAA8D]">admin / admin123</span></p>
              <p className="text-white/30 text-[11px] mt-2">Vault: aggroso2024 • Spring Boot Ready</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  );

  return (
    <div className="min-h-screen relative">
      <div className="bg-aura"></div>
      <div className="fixed inset-0 z-[-1] bg-[#131A15]/60"></div>
      <div className="relative z-10 max-w-6xl mx-auto p-4 md:p-6">
        <header className="bg-[#1A2420]/90 backdrop-blur border border-white/10 p-4 rounded-2xl flex justify-between items-center text-white">
          <div className="flex items-center gap-3"><div className="w-9 h-9 rounded-xl bg-[#8DAA8D] text-[#131A15] flex items-center justify-center font-black">A</div><h1 className="font-bold">Aggroso • {role.toUpperCase()}</h1></div>
          <div className="flex gap-2">
            <button onClick={()=>setView('user')} className={`px-5 py-2 rounded-full text-sm font-bold ${view==='user'?'bg-[#8DAA8D] text-black':'bg-white/10 text-white'}`}>User</button>
            <button onClick={()=>setView('admin')} className={`px-5 py-2 rounded-full text-sm font-bold ${view==='admin'?'bg-[#8DAA8D] text-black':'bg-white/10 text-white'}`}>Admin ({hist.length})</button>
            <button onClick={()=>{localStorage.clear(); setLogged(false);}} className="bg-red-500/80 text-white px-4 py-2 rounded-full text-xs font-bold">Logout</button>
          </div>
        </header>

        {view==='user' && <div className="grid md:grid-cols-12 gap-6 mt-6">
          <div className="md:col-span-5 bg-[#1A2420]/90 backdrop-blur border border-white/10 p-6 rounded-2xl text-white">
            <h3 className="font-bold text-lg serif">New Expense</h3>
            <div className="space-y-3 mt-5">
              <div className="grid grid-cols-2 gap-3"><input value={form.claimant} onChange={e=>setForm({...form,claimant:e.target.value})} className="aura-input p-3.5 rounded-xl text-sm" placeholder="Name"/><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} className="aura-input p-3.5 rounded-xl text-sm"/></div>
              <div className="grid grid-cols-2 gap-3"><select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} className="aura-input p-3.5 rounded-xl text-sm"><option>MEALS</option><option>TRAVEL</option><option>LODGING</option><option>MISC</option></select><input type="number" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} className="aura-input p-3.5 rounded-xl text-sm font-bold"/></div>
              <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows="3" className="aura-input w-full p-3.5 rounded-xl text-sm" placeholder="Description"></textarea>
              <button onClick={submit} className="aura-btn w-full py-4 rounded-full font-bold">Submit for Review</button>
            </div>
          </div>
          <div className="md:col-span-7 space-y-4">
            {res && <div className={`p-6 rounded-2xl ${res.status==='COMPLIANT'?'bg-[#8DAA8D] text-[#131A15]':'bg-amber-700 text-white'}`}><div className="flex justify-between"><span className="bg-[#131A15] text-white px-3 py-1 rounded-full text-xs font-bold">{res.status}</span><span className="text-xs opacity-80">{res.claimId}</span></div><h2 className="text-2xl font-bold mt-3">{res.category} • ${res.amount}</h2><p className="mt-2 text-sm opacity-90">{res.note}</p></div>}
            <div className="bg-[#1A2420]/90 backdrop-blur border border-white/10 rounded-2xl p-6 text-white"><h4 className="font-bold serif">My Claims</h4><div className="mt-4 space-y-2 max-h-[60vh] overflow-auto">{hist.map(h=><div key={h.claimId} className="flex justify-between items-center p-4 rounded-xl bg-white/[0.05] border border-white/10"><div><div className="font-bold text-sm">{h.claimant} • {h.category} • ${h.amount}</div><div className="text-[11px] text-white/40">{h.claimId} • {h.date} • {h.note}</div></div><span className={`px-3 py-1 rounded-full text-[10px] font-bold ${h.status==='COMPLIANT'?'bg-[#8DAA8D] text-black':'bg-amber-600 text-white'}`}>{h.status}</span></div>)}</div></div>
          </div>
        </div>}

        {view==='admin' && <div className="bg-[#1A2420]/90 backdrop-blur border border-white/10 rounded-2xl p-6 mt-6 text-white">
          {!unlock? <div className="text-center py-16"><div className="text-5xl">🔒</div><h3 className="font-bold text-xl mt-4 serif">Secure Vault</h3><button onClick={()=>{let p=prompt('Vault Password:'); if(p==='aggroso2024') setUnlock(true); else alert('aggroso2024');}} className="mt-6 px-8 py-3 bg-[#8DAA8D] text-black rounded-full font-bold">Unlock Vault</button></div> : <>
          <div className="flex justify-between items-center mb-6"><h3 className="font-bold text-lg serif">Admin Dashboard</h3><button onClick={()=>setUnlock(false)} className="text-xs bg-white/10 px-3 py-1 rounded-full">Lock 🔒</button></div>
          <div className="space-y-2 max-h-[60vh] overflow-auto">{hist.map(h=><div key={h.claimId} className="bg-white/[0.05] border border-white/10 p-4 rounded-xl flex justify-between items-center"><div><div className="font-bold text-sm">{h.claimant} • {h.category} • ${h.amount} • {h.claimId}</div><div className="text-xs text-white/40">{h.note} • {h.claimant.toLowerCase()}@company.com</div></div><div className="flex gap-2"><button onClick={()=>setHist(p=>p.map(x=>x.claimId===h.claimId?{...x,status:'APPROVED'}:x))} className="bg-[#8DAA8D] text-black px-4 py-2 rounded-full text-xs font-bold">Approve</button><button onClick={()=>setHist(p=>p.map(x=>x.claimId===h.claimId?{...x,status:'REJECTED'}:x))} className="bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold">Reject</button></div></div>)}</div></>}
        </div>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
